<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="200" viewBox="0 0 1200 200" role="img" aria-label="Victor Guminski — Polish/Norwegian developer based in Bergen, Norway — Vg1 IM — HTML CSS JS TS React Vite NestJS Node.js — Goal Full-stack dev">
  <title>Victor Guminski — Polish/Norwegian developer — Bergen, Norway — Vg1 IM</title>

  <style>
    .sans { font-family: Inter, system-ui, -apple-system, "Segoe UI", sans-serif; }
    .line1 { font-size: 18px; font-weight: 600; fill: #FFFFFF; }
    .line2 { font-size: 12px; font-weight: 400; fill: #FFFFFF; fill-opacity: 0.6; }
    .cursor { font-size: 18px; font-weight: 600; fill: #C6FF00; animation: blink 1s step-end infinite; }
    .pulse-dot { animation: pulse 2s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
    @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }
    @keyframes pulse { 0%, 100% { opacity: 1; transform: scale(1); } 50% { opacity: 0.35; transform: scale(0.72); } }
    @media (prefers-reduced-motion: reduce) {
      .cursor, .pulse-dot { animation: none; }
    }
  </style>

  <rect width="1200" height="200" fill="#000000"/>

  <!-- Top border glow: 2px solid #C6FF00 with soft falloff -->
  <rect x="0" y="0" width="1200" height="12" fill="#C6FF00" opacity="0.07"/>
  <rect x="0" y="0" width="1200" height="6" fill="#C6FF00" opacity="0.14"/>
  <rect x="0" y="0" width="1200" height="2" fill="#C6FF00"/>

  <!-- Exact VG logo, 80px: V white #FFFFFF, G lime #C6FF00, lime node dot on G, black #000000 -->
  <g transform="translate(40 60) scale(0.15625)">
    <rect width="512" height="512" rx="128" fill="#000000"/>
    <path d="M72 150 H140 L197 308 L254 150 H322 L229 378 H165 Z" fill="#FFFFFF"/>
    <path d="M404 195 A84 84 0 1 0 404 333" fill="none" stroke="#C6FF00" stroke-width="50"/>
    <path d="M356 264 H440 V333" fill="none" stroke="#C6FF00" stroke-width="50"/>
    <path d="M292 138 L287 152" stroke="#C6FF00" stroke-width="9"/>
    <circle cx="298" cy="122" r="19" fill="#C6FF00"/>
  </g>

  <!-- Center text, Inter -->
  <text x="600" y="93" text-anchor="middle" class="sans line1">Victor Guminski — Polish/Norwegian developer — Bergen, Norway — Vg1 IM</text>
  <text x="600" y="119" text-anchor="middle" class="sans line2">HTML • CSS • JavaScript • TypeScript • React • Vite • NestJS • Node.js — Goal: Full-stack dev</text>

  <!-- Right: pulsing lime dot 8px + blinking cursor -->
  <circle class="pulse-dot" cx="1124" cy="86" r="4" fill="#C6FF00"/>
  <text x="1140" y="93" class="sans cursor">_</text>

  <!-- Bottom border: 2px solid #C6FF00 -->
  <rect x="0" y="198" width="1200" height="2" fill="#C6FF00"/>
</svg>
