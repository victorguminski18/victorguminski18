<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="1200" height="400" role="img" aria-label="Victor Guminski. I build websites and apps. HTML, CSS, JavaScript and TypeScript. Vg1 IM student, Bergen, Norway. Goal: Full-stack dev.">
  <title>Victor Guminski — banner</title>
  <defs>
    <radialGradient id="limeGlow" gradientUnits="userSpaceOnUse" cx="120" cy="0" r="560">
      <stop offset="0" stop-color="#C6FF00" stop-opacity="0.08"/>
      <stop offset="1" stop-color="#C6FF00" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <style>
    .sans { font-family: Inter, system-ui, -apple-system, "Segoe UI", sans-serif; }
    .mono { font-family: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .name { font-size: 72px; font-weight: 800; letter-spacing: -1.5px; fill: #FFFFFF; }
    .sub { font-size: 18px; font-weight: 400; fill: #A0A0A0; }
    .status { font-size: 14px; fill: #C6FF00; }
    .top { font-size: 10px; fill: #A0A0A0; }
    .foot { font-size: 11px; fill: #888888; }
    .dot { animation: blink 2s ease-in-out infinite; }
    @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0.2; } }
    @media (prefers-reduced-motion: reduce) {
      .dot { animation: none; }
    }
  </style>

  <rect width="1200" height="400" fill="#000000"/>
  <rect width="1200" height="400" fill="url(#limeGlow)"/>

  <text x="1180" y="28" text-anchor="end" class="mono top">victorguminski.com • No tracking</text>

  <text x="600" y="172" text-anchor="middle" class="sans name">Victor Guminski</text>
  <rect x="530" y="196" width="140" height="4" rx="2" fill="#C6FF00"/>
  <text x="600" y="248" text-anchor="middle" class="sans sub">I build websites and apps. HTML, CSS, JavaScript and TypeScript.</text>
  <text x="600" y="292" text-anchor="middle" class="mono status"><tspan class="dot">●</tspan> Vg1 IM student • Bergen, Norway • Goal: Full-stack dev</text>

  <text x="20" y="376" class="mono foot">Available for projects — github.com/victorguminski18</text>
</svg>
