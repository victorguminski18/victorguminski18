<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="200" viewBox="0 0 1200 200" role="img" aria-label="Victor Guminski, Vg1 IM student in Bergen, Norway">
  <title>Victor Guminski</title>

  <style>
    .name { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 46px; font-weight: 700; fill: #FFFFFF; }
    .sub  { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 20px; font-weight: 400; fill: #FFFFFF; fill-opacity: 0.85; }
    .sub2 { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 20px; font-weight: 400; fill: #FFFFFF; fill-opacity: 0.55; }
  </style>

  <rect width="1200" height="200" fill="#000000"/>

  <!-- VG logo -->
  <g transform="translate(48 50) scale(0.1953125)">
    <rect width="512" height="512" rx="128" fill="#000000"/>
    <path d="M72 150 H140 L197 308 L254 150 H322 L229 378 H165 Z" fill="#FFFFFF"/>
    <path d="M404 195 A84 84 0 1 0 404 333" fill="none" stroke="#C6FF00" stroke-width="50"/>
    <path d="M356 264 H440 V333" fill="none" stroke="#C6FF00" stroke-width="50"/>
    <path d="M292 138 L287 152" stroke="#C6FF00" stroke-width="9"/>
    <circle cx="298" cy="122" r="19" fill="#C6FF00"/>
  </g>

  <text x="184" y="84" class="name">Victor Guminski</text>
  <rect x="186" y="100" width="56" height="4" fill="#C6FF00"/>
  <text x="184" y="134" class="sub">Vg1 IM student in Bergen, Norway</text>
  <text x="184" y="162" class="sub2">I build websites with HTML, CSS, JavaScript and TypeScript.</text>
  <text x="1152" y="162" text-anchor="end" class="sub2">victorguminski.com</text>
</svg>
